<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <style>
      .f{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
    </style>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <!-- grid dots -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="900" cy="60" r="3"/><circle cx="940" cy="60" r="3"/><circle cx="980" cy="60" r="3"/><circle cx="1020" cy="60" r="3"/><circle cx="1060" cy="60" r="3"/><circle cx="1100" cy="60" r="3"/>
    <circle cx="900" cy="100" r="3"/><circle cx="940" cy="100" r="3"/><circle cx="980" cy="100" r="3"/><circle cx="1020" cy="100" r="3"/><circle cx="1060" cy="100" r="3"/><circle cx="1100" cy="100" r="3"/>
    <circle cx="900" cy="140" r="3"/><circle cx="940" cy="140" r="3"/><circle cx="980" cy="140" r="3"/><circle cx="1020" cy="140" r="3"/><circle cx="1060" cy="140" r="3"/><circle cx="1100" cy="140" r="3"/>
  </g>
  <!-- loop mark -->
  <g transform="translate(985,200)">
    <circle r="62" fill="none" stroke="url(#acc)" stroke-width="6" stroke-dasharray="300 90" stroke-linecap="round"/>
    <path d="M 50 -38 l 16 -4 l -6 16" fill="none" stroke="#A78BFA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="f" x="0" y="9" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">AI</text>
  </g>
  <text class="f" x="64" y="88" font-size="20" font-weight="600" fill="#93C5FD" letter-spacing="3">CLAUDE CODE WORKFLOW</text>
  <text class="f" x="62" y="158" font-size="56" font-weight="800" fill="#ffffff">AI와 일하는 방식</text>
  <rect x="64" y="182" width="120" height="6" rx="3" fill="url(#acc)"/>
  <text class="f" x="64" y="232" font-size="26" font-weight="500" fill="#E2E8F0">맡기고 · 직접 재 보고 · 확인한 것은 남긴다</text>
  <text class="f" x="64" y="272" font-size="19" fill="#94A3B8">프로젝트 6개를 하며 굳힌 규칙과, 그 규칙을 옮긴 Claude Code 스킬 11종</text>
